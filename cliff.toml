[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | upper_first }}{% if commit.breaking %} **[BREAKING]**{% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Skwad's Swift-era tags have four components (v1.9.0.136, the trailing part
# being the Xcode build number). cargo cannot parse those: git-cliff bumped
# v1.9.0.136 to v1.9.1.0 and `cargo set-version` rejected it with "unexpected
# character '.' after patch version number". Only three-component tags count as
# releases here. The annotated `v1.9.0` tag sits on the same commit as
# `v1.9.0.136` and is the baseline: it bounds the changelog to the Rust port's
# own work and makes the next version 1.10.0, continuing Skwad's line.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

# Map commit types to changelog groups, and set which types
# count toward a "breaking"/major bump.
commit_parsers = [
  # Excluded from the changelog entirely. `scope = "..."` in a commit_parsers
  # entry does NOT filter by the commit's scope -- it *assigns* one, the same
  # way `group = "..."` does. Scope-based exclusion has to match the
  # "type(scope): ..." prefix in `message` instead. These rules run before the
  # type rules below, so e.g. `fix(ci): ...` is skipped rather than landing in
  # "Fixed" -- CI/release tooling is internal maintenance, not user-facing.
  { message = "^\\w+\\(ci\\)", skip = true },
  { message = "^\\w+\\(internal\\)", skip = true },
  { message = "^\\w+\\(dev\\)", skip = true },
  { message = "^\\w+\\(release\\)", skip = true },
  { message = "^\\w+\\(openspec\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },

  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc", group = "Documentation" },
]

# Exclude specific scopes regardless of type, e.g. internal tooling
# that isn't user-facing.
filter_commits = true

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
# Only reached if the baseline tag above ever goes missing; with it in place
# the version is computed from the commits since v1.9.0.
initial_tag = "v1.10.0"

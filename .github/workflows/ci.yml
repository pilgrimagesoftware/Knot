name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Checkout and `make` only: the token is never used to write anything.
permissions:
  contents: read

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies (gpui-component build requirements)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev \
            vulkan-validationlayers libvulkan1

      - name: Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          cache-key: ${{ matrix.os }}

      # The rustfmt pin lives in the Makefile (RUSTFMT_NIGHTLY), which is also
      # what runs the check -- so the toolchain and the command it is invoked
      # with can never drift apart between here and a developer's machine.
      #
      # Installed with plain rustup rather than setup-rust-toolchain: that
      # action makes whatever it installs the default toolchain, which would
      # send Clippy, Test and Build below to nightly (no cargo-clippy there).
      - name: rustfmt toolchain (pinned)
        run: rustup toolchain install "$(make -s print-rustfmt-nightly)" --profile minimal --component rustfmt

      - name: Format
        run: make fmt-check

      # A file nobody can hold in their head stops being reviewed properly,
      # and the only reliable moment to split one is before it gets large.
      # This limit was applied once by hand and then regressed, because
      # nothing enforced it.
      - name: File size
        run: make size-check

      # An undeclared module is not compiled, so a test file that loses its
      # `mod` line stops running while the suite stays green. The moment it
      # happens is a merge conflict in a sorted run of `mod` lines.
      - name: Declared modules
        run: make declared-check

      - name: Git version (needs >= 2.30 for porcelain v2 tests)
        run: |
          git --version
          v=$(git --version | awk '{print $3}')
          low=$(printf '2.30.0\n%s\n' "$v" | sort -V | head -1)
          if [ "$low" != "2.30.0" ]; then
            echo "git $v is older than the 2.30 floor"; exit 1
          fi

      - name: Clippy
        run: make lint

      # Every workspace crate, one at a time, so a hang or failure names its
      # crate - in a log group per crate and an error annotation per failing
      # one. The list comes from `cargo metadata`: a hand-kept list of steps
      # here covered five crates of nineteen, and knot-processes - whose
      # `kill` reached every process the user owns on Linux - was one of the
      # fourteen that never ran (hotfix 1.24.1).
      - name: Test (every crate)
        run: scripts/test-each-crate.sh

      - name: Build
        run: make build

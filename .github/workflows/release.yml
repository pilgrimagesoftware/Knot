name: Release

permissions:
  contents: write
  # rust-release.yaml uses OIDC for crates.io publishing, so the reusable
  # workflow call requires the id-token permission on this caller too.
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: pilgrimagesoftware/github-actions/.github/workflows/rust-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # `--exclude knot` keeps the test *binary* for the `knot` crate from
      # building, but its workspace dependencies (gpui and friends) still
      # need to compile to resolve the workspace graph, and gpui's system
      # libraries (fontconfig, wayland, webkit, xkbcommon) aren't on the
      # reusable workflow's runner by default. ci.yml already runs the whole
      # workspace, including `knot`, on both Linux and macOS for every push
      # and PR, so this list only needs to satisfy the build, not the test.
      test-args: "--workspace --exclude knot"
      linux-packages: >-
        gcc g++ clang libfontconfig-dev libwayland-dev
        libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev
        libssl-dev libzstd-dev
      publish-to-crates-io: false
      release-branch: main
      merge-back-branch: develop
    secrets:
      PSW_CI_APP_ID: ${{ secrets.PSW_CI_APP_ID }}
      PSW_CI_PRIVATE_KEY: ${{ secrets.PSW_CI_PRIVATE_KEY }}

  # Packages Knot.app for the released tag and attaches the DMG to the release
  # the job above created.
  package:
    needs: release
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    secrets: inherit

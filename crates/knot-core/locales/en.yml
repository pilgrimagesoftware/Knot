    register_agent: "Register Agent"
    deactivate: "Deactivate"
    restart_agent: "Restart Agent"
    remove_agent: "Remove Agent"
    # What the two confirming row actions ask before they run.
    confirm:
      restart_title: "Restart Agent"
      restart_body: "Restart \"%{name}\"? Its session will be cleared."
      remove_title: "Remove Agent"
      remove_body: "Remove \"%{name}\"? This closes its session and cannot be undone."
  # The agent list's background menu, over the workspace rather than
  # any one agent.
  sidebar:
    new_agent: "New Agent"
    restart_all: "Restart All"
    close_all: "Close All"
    deactivate_all: "Deactivate All"
    broadcast: "Broadcast to All Agents…"
    # The bulk actions' confirmations. %{agents} is a localized count and
    # noun together ("1 agent", "3 agents"), so the sentence can put them
    # where its own grammar needs them.
    confirm:
      restart_all_title: "Restart All"
      restart_all_body: "Restart %{agents}? Every session is cleared and cannot be recovered."
      close_all_title: "Close All"
      close_all_body: "Close %{agents}? This closes every session and cannot be undone."


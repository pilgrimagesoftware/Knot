mcp_server:
  failure_title: "Knot - MCP server"
  failure_body: "The MCP server is not running. Agents cannot reach Knot until it recovers."

# The MCP servers section in a Panel-mode agent's pane. Distinct from
# `mcp_server` above, which is Knot's own server in the settings window: this
# is what a *particular agent* can reach, most of which Knot does not control.
mcp:
  title: "MCP Servers"
  # The agent has no live session, so there is nothing to ask and the last
  # answer - if there was one - is about a process that is gone.
  summary_not_running: "Not running"
  # A probe is in flight. Seconds, not a resting state: an MCP health check
  # crosses the network for every configured server.
  summary_checking: "Checking…"
  # The probe could not run or could not be read. Shown in place of the
  # summary, while any rows an earlier probe found stay below it.
  summary_failed: "Could not check: %{error}"
  # Between becoming visible and the first probe starting. A moment.
  summary_not_checked: "Not checked yet"
  # Knot has no way to interrogate this agent type. Deliberately not "None":
  # telling a user their agent has no MCP servers when the truth is that Knot
  # cannot ask is worse than admitting the gap.
  cannot_determine_short: "Unknown"
  summary_cannot_determine: "Cannot determine this agent's MCP servers"
  # A probe completed and the agent genuinely has none configured.
  summary_none: "No MCP servers configured"
  # Every server the probe found is connected.
  summary_all_connected: "All connected"
  # Nothing needs attention, but not everything is connected either - some are
  # disabled, pending approval, or in a state Knot could not read. Claiming
  # "all connected" here would be the header lying about the one thing it is
  # for.
  summary_no_attention: "%{count} servers, none need attention"
  # Collapsed, the header names what is asking for something.
  summary_attention: "%{names} need attention"
  # What the listed names did not cover. `%{count}` counts servers.
  summary_attention_more: "%{names} +%{count} more need attention"
  # Between two names in that list; punctuation is the translator's.
  summary_separator: ", "
  # Expanded, the rows below are the detail, so the header counts them.
  count_one: "server"
  count_many: "servers"
  # The six states, a closed vocabulary. The middle four are all "not
  # connected" and mean four different things: two are the user's own choice,
  # one is a lock, one is a fault.
  state_connected: "Connected"
  state_needs_authentication: "Needs authentication"
  state_pending_approval: "Pending approval"
  state_disabled: "Disabled"
  state_failed: "Failed"
  state_unknown: "Unknown"
  # Knot's own server, registered in the agent's configuration by hand as well
  # as injected into its session. One row, and this says why it will outlive
  # the session Knot controls.
  also_configured: "Also registered in this agent's own configuration"
  # The rows are a separate process's view of the same configuration, not the
  # running session's live connections, so they are stamped rather than
  # presented as current.
  taken_at: "Checked %{age} ago"
  taken_just_now: "Checked just now"
  # One entry per shape rather than a number glued to a unit here: where the
  # number sits relative to its unit is the translator's to decide.
  age_seconds: "%{seconds}s"
  age_minutes: "%{minutes}m"
  age_hours: "%{hours}h"
  # Actions.
  action_refresh: "Check again"
  # The delegated action. Knot opens the agent's own flow in a terminal; it
  # never authenticates anything itself.
  action_manage: "Fix in %{agent}"
  # Appended when the agent has no per-server command and the user has to
  # pick the server in its own UI, so the tooltip says what to type.
  action_manage_hint: "Fix in %{agent} — then type %{send}"
  action_copy_target: "Copy address"
  # The shell companion opened for the handover, named so it is obvious in
  # the sidebar what it is and that closing it is fine.
  terminal_name: "MCP"

processes:
  title: "Processes"
  # Before the first sample lands there is no summary to give. Deliberately
  # not "0": a section that says nothing is running while it is still
  # looking is worse than one that admits it does not know yet. Now that the
  # sampler runs while the section is merely shown, this is a moment rather
  # than the permanent state it used to be.
  count_unknown: "Counting…"
  # Nothing running - an idle agent, or one that has stopped.
  count_none: "None"
  # Expanded, the rows below are the detail, so the header counts them.
  count_one: "process"
  count_many: "processes"
  # Collapsed, the header names what is running instead of counting it.
  # Between two names in that list; punctuation is the translator's.
  summary_separator: ", "
  # What the listed names did not cover. `%{count}` counts processes, not
  # names: the question behind a glance at the header is how much is running.
  summary_more: "%{names} +%{count} more"
  column_command: "Command"
  column_runtime: "Runtime"
  column_pid: "PID"
  background: "Background"
  foreground: "Foreground"
  # Runtime, one entry per shape rather than assembled from units at the
  # call site, so the order and the spacing stay the translator's.
  runtime_days: "%{days}d %{hours}h"
  runtime_hours: "%{hours}h %{minutes}m"
  runtime_minutes: "%{minutes}m %{seconds}s"
  runtime_seconds: "%{seconds}s"
  terminate: "Terminate"
  terminating: "Terminating…"
  terminate_title: "Terminate this process?"
  terminate_body: "Knot asks %{command} to stop, and kills it if it does not. Anything it has not saved is lost."
  terminate_failed: "That process could not be terminated: %{reason}"
  copy_pid: "Copy process ID"
  copied_pid: "Copied the process ID"
  copy_command: "Copy full command"
  copied_command: "Copied the full command"
  open_viewer: "Open Activity Monitor"
  # The two groups the expanded section lists. Labelled rather than merely
  # ordered, because a subagent and a process are different kinds of thing
  # and a row of one must not read as a row of the other.
  group_subagents: "Subagents"
  group_processes: "Processes"
  # A subagent's state. The words are ours; its kind and task are the
  # agent's own data and are shown verbatim.
  subagent_running: "Running"
  subagent_finished: "Finished"
  subagent_failed: "Failed"
  # Shown where a subagent row would show its kind and the agent named
  # none. Deliberately not blank: the row still describes something real.
  subagent_kind_unstated: "Subagent"
  # Expanded, the header counts each group separately - two subagents and
  # three processes is not five of anything.
  subagent_count_one: "subagent"
  subagent_count_many: "subagents"
  copy_task: "Copy full task"
  copied_task: "Copied the full task"
  # A failed subagent's reason, where the agent gave one.
  subagent_failed_reason: "Failed: %{reason}"
  empty_not_running: "This agent is not running, so nothing descends from it."
  empty_none: "This agent has not started anything that is still running."
  sample_failed: "The process list could not be read: %{reason}"
  # A running agent that can report subagents and has dispatched none.
  # Distinct from the section simply omitting the group, which is what an
  # agent Knot cannot ask says.
  empty_no_subagents: "This agent has not dispatched any subagents."

git_panel:
  title: "Git Status"
  refresh: "Refresh"
  close: "Close panel"
  # States. A folder that is not a repository is a different answer from a
  # clean working tree, which is why it has its own line.
  loading: "Loading…"
  clean: "Working tree clean"
  not_a_repository: "This folder is not a git repository."
  status_failed: "The repository status could not be read: %{reason}"
  action_failed: "That change could not be made: %{reason}"
  interrupted: "That operation did not finish. The panel has been left as it was."
  error:
    path_not_utf8: "That path is not valid UTF-8, so git cannot be asked about it."
  # Branch header.
  ahead: "%{count} ahead"
  behind: "%{count} behind"
  detached_head: "Detached HEAD"
  # Sections, each with its own count line so the number stays beside the
  # translator's noun rather than being concatenated at the call site.
  section:
    staged: "Staged Changes"
    unstaged: "Changes"
    untracked: "Untracked"
    conflicted: "Conflicts"
  section_count: "%{count}"
  # Row and bulk actions.
  stage: "Stage"
  unstage: "Unstage"
  discard: "Discard"
  stage_all: "Stage All"
  unstage_all: "Unstage All"
  discard_title: "Discard changes to %{path}?"
  discard_body: "The changes to %{path} are thrown away. Nothing can bring them back."
  discard_confirm: "Discard"
  # Diff pane.
  select_a_file: "Select a file to view its diff"
  additions: "+%{count}"
  deletions: "-%{count}"
  binary_file: "Binary file"
  no_changes: "No changes"
  diff_failed: "That diff could not be read: %{reason}"
  diff_truncated: "This diff is too large to show in full; the first %{count} lines are shown."
  # Commit.
  commit: "Commit"
  commit_title: "Commit staged changes"
  commit_placeholder: "Commit message"
  commit_hint: "The first line is the subject. Leave a blank line before the body."
  commit_cancel: "Cancel"
  commit_failed: "The commit failed: %{reason}"
  committing: "Committing…"

# The artifact panel: the side panel holding an agent's markdown file and its
# diagram at once. Its two sections are drawn by the panes that were ported
# first; these are the container's own words.
artifact_panel:
  title: "Artifacts"
  # The expand control names the state it moves to, not the one it is in,
  # which is how every other toggle in the window is worded.
  expand: "Expand panel"
  collapse: "Collapse panel"
  # Distinct from a section's own close: this one takes both.
  close_all: "Close all"
  # The chevron on a section header. Present only when both sections are open,
  # since a lone section has no other to give its height to.
  collapse_section: "Collapse section"
  expand_section: "Expand section"

# The variables a library prompt or custom startup prompt can use, as the
# prompt editors list them.
prompt_variables:
  insert: "Insert variable"
  unknown: "Unknown variable: %{names}"
  agent_name: "the agent's name"
  agent_id: "the agent's knot ID"
  agent_type: "the agent's type"
  folder: "the agent's folder"
  folder_name: "the folder's name"
  workspace: "the workspace's name"
  branch: "the folder's current branch"
  date: "today's date"

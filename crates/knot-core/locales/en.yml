processes:
  title: "Processes"
  # Before the first sample lands there is no summary to give. Deliberately
  # not "0": a section that says nothing is running while it is still
  # looking is worse than one that admits it does not know yet. Now that the
  # sampler runs while the section is merely shown, this is a moment rather
  # than the permanent state it used to be.
  count_unknown: "Counting…"
  # Nothing running - an idle agent, or one that has stopped.
  count_none: "None"
  # Expanded, the rows below are the detail, so the header counts them.
  count_one: "process"
  count_many: "processes"
  # Collapsed, the header names what is running instead of counting it.
  # Between two names in that list; punctuation is the translator's.
  summary_separator: ", "
  # What the listed names did not cover. `%{count}` counts processes, not
  # names: the question behind a glance at the header is how much is running.
  summary_more: "%{names} +%{count} more"
  column_command: "Command"
  column_runtime: "Runtime"
  column_pid: "PID"
  background: "Background"
  foreground: "Foreground"
  # Runtime, one entry per shape rather than assembled from units at the
  # call site, so the order and the spacing stay the translator's.
  runtime_days: "%{days}d %{hours}h"
  runtime_hours: "%{hours}h %{minutes}m"
  runtime_minutes: "%{minutes}m %{seconds}s"
  runtime_seconds: "%{seconds}s"
  terminate: "Terminate"
  terminating: "Terminating…"
  terminate_title: "Terminate this process?"
  terminate_body: "Knot asks %{command} to stop, and kills it if it does not. Anything it has not saved is lost."
  terminate_failed: "That process could not be terminated: %{reason}"
  copy_pid: "Copy process ID"
  copied_pid: "Copied the process ID"
  copy_command: "Copy full command"
  copied_command: "Copied the full command"
  open_viewer: "Open Activity Monitor"
  empty_not_running: "This agent is not running, so nothing descends from it."
  empty_none: "This agent has not started anything that is still running."
  sample_failed: "The process list could not be read: %{reason}"

  # The Window menu's own items. macOS appends and maintains the list of
  # open windows below them.
  window:
    command_center: "Command Center"
    workspaces: "Workspaces"
  # One agent row's context menu, and the menu bar's Agents menu,
  # which is built from the same entry list.
  agent:
    new_companion: "New Companion…"
    new_shell_companion: "New Shell Companion"
    edit_agent: "Edit Agent…"
    fork_agent: "Fork Agent"
    duplicate_agent: "Duplicate Agent"

[package]
name = "knot-terminal"
version = "1.23.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The `_meta` a session opens with.
serde_json.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
uuid.workspace = true
gpui-terminal.workspace = true
knot-acp = { path = "../knot-acp" }
knot-activity = { path = "../knot-activity" }
knot-agent-launch = { path = "../knot-agent-launch" }
knot-agents = { path = "../knot-agents" }
knot-core = { path = "../knot-core" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

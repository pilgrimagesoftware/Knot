[package]
name = "knot-agent-launch"
version = "1.23.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uuid.workspace = true
knot-core = { path = "../knot-core" }
knot-acp = { path = "../knot-acp" }
knot-git = { path = "../knot-git" }
# Reads `permissions.defaultMode` from Claude Code's settings files.
serde_json.workspace = true
# Splits the Coding tab's free-text agent options into words.
shell-words.workspace = true
# `local-offset` for `{{date}}` in the local time zone.
time = { workspace = true, features = ["local-offset"] }

[dev-dependencies]
tempfile.workspace = true

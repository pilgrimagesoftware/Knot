[package]
name = "gpui-terminal"
version = "0.1.0"
edition.workspace = true
# Not `license.workspace`: the rest of Knot is AGPL, and this crate is meant to
# be embedded by other GPUI apps (Fernrohr runs it over a Kubernetes exec), so
# it carries its own permissive licence. It must therefore never depend on a
# `knot-*` crate - that would pull AGPL code back into it. The text is in
# `LICENSE-MIT` beside this manifest.
license = "MIT"
repository.workspace = true
rust-version.workspace = true
description = "A terminal emulator view for GPUI, backed by alacritty_terminal, over any byte transport"

[features]
default = ["pty"]
# A local pseudo-terminal transport. Off for an embedder whose bytes come from
# somewhere else (a remote exec, a serial line) and that has no use for
# `portable-pty` in its build.
pty = ["dep:portable-pty"]

[dependencies]
alacritty_terminal = "0.26.0"
# Wakes the view's pump when a transport thread delivers output. Executor-
# agnostic, so it works on GPUI's foreground executor without pulling in a
# runtime; already in the lockfile through GPUI.
async-channel = "2.5"
# No default features: the view uses core GPUI only, not the component
# library or the bundled assets. Bump together with `crates/knot`'s pin - two
# `gpui` versions in one build are two incompatible `Entity` types.
gpui-kit = { version = "0.6", default-features = false }
parking_lot.workspace = true
portable-pty = { version = "0.9.0", optional = true }
thiserror.workspace = true

[dev-dependencies]
# GPUI's headless test platform, to drive the view's pump, layout and input
# without a display.
gpui-kit = { version = "0.6", default-features = false, features = ["test-support"] }
tempfile.workspace = true

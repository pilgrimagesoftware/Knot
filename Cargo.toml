[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/pilgrimagesoftware/Knot"
rust-version = "1.98"

[workspace.dependencies]
thiserror = "2.0.20"
tempfile = "3.27"
insta = "1.43"
notify = "8.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros", "net", "signal", "io-util"] }
tokio-stream = "0.1.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
directories = "6.0.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
axum = "0.8.9"
async-trait = "0.1.92"
# No lock poisoning: `lock()` hands back the guard, so there is no `unwrap()`
# to forget and no two-policy split between panicking and silently skipping.
parking_lot = "0.12.5"
# Holds the shared settings surface. A read is a refcount bump, not a lock,
# which is what lets the render path read settings at GPUI's per-keystroke
# rate; it also keeps the surface out of any lock-ordering relationship with
# `AgentStore`'s mutex. A mutex was the alternative and is why #238 could not
# simply be shared. Already in the lockfile transitively, so this promotes an
# existing dependency rather than adding one.
arc-swap = "1.9.2"
rust-i18n = "4.2.2"
# Reads Skwad's preferences for `data-import`. macOS-relevant only, but
# declared unconditionally so the workspace goes on building on Linux for CI,
# where the import simply finds no preferences. `defaults read` was the
# alternative: a lossy text format that has to be re-parsed, macOS-only in a
# way a library is not, and a subprocess whose output shape is a UI convention.
plist = "1.10.1"
# The terminal grid, `Transport` trait and GPUI `TerminalView`, shared with
# Fernrohr. Its own repository because it is MIT, not AGPL, and its CI proves
# the standalone build against crates.io with no `[patch]`. It pins
# `gpui-kit = "=0.7.0"` exactly, so bump the tag together with `crates/knot`'s
# pin: two `gpui` versions in one build are two incompatible `Entity` types.
gpui-terminal = { git = "https://github.com/pilgrimagesoftware/gpui-terminal", tag = "v0.2.2" }

# `gpui-base` puts `auto_grow`, `set_auto_grow`, `rows` and `set_rows` on
# `impl InputBaseState<TextareaMode>`, so an `EditorState` has no row sizing at
# all - and the panel composer needs both: `EditorState` for the styled ranges
# (decorations are keyed off the mode marker, and `TextareaMode`'s is `()`,
# which carries no decoration layers) and auto-grow for the sizing it already
# has. Nothing in the layout or render path requires a textarea; only the
# `impl` block's bound does.
#
# The fork moves those four methods to the existing `impl<M: MultiLineMode>`
# block with no change to any body, keys indent-on-newline to the layout, and
# carries the Shift+Enter submit-chord fixes (#565). It is branched from
# `v0.7.0` - the version `crates/knot` pins - so this patch is those commits
# and nothing else, rather than a version bump wearing a patch's clothes.
# 0.7.0 still has the `TextareaMode`-only bound, so the bump rebased the fork
# rather than retiring it.
#
# Delete this entry, and the fork, once a release carries the relaxed bound.
# `docs/adr/0003-gpui-base-fork-on-0-7.md` records the commits and the
# exit condition.
[patch.crates-io]
gpui-base = { git = "https://github.com/pilgrimagesoftware/gpui-kit", branch = "knot/auto-grow-0.7.0" }
